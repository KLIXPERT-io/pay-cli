#
# v0.1.0 ships binaries plus install.sh / install.ps1 only. The two blocks
# below are kept, configured and reviewed so that turning them on later is a
# one-commit change rather than a design exercise — but each needs
# infrastructure that does not exist yet:
#
#   homebrew_casks  needs the KLIXPERT-io/homebrew-tap repository to exist and
#                   a HOMEBREW_TAP_TOKEN secret with write access to it.
#                   (`brews:` is fully deprecated as of GoReleaser v2.16;
#                   `homebrew_casks` is the supported successor.)
#
#   nfpms           needs a decision about where .deb/.rpm/.apk are hosted and
#                   signed. Attaching unsigned distro packages to a GitHub
#                   release teaches users to install packages nobody verifies,
#                   which is worse than not shipping them.
#
# Do not uncomment either one without the matching infrastructure: goreleaser
# fails the whole release when a publish target is misconfigured.
