# golangci-lint v2 configuration. `make lint` runs this plus arch-lint.sh,
# which enforces the §3.1 rules a linter cannot express (os.Stdout outside
# app.go, http.Request construction outside transport.go, api_key as a TOML key
# in an example config, and so on).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # every response body is closed; PayCLI is long-lived under --all
    - copyloopvar
    - errorlint      # errors.Is/As instead of == and type assertions (apierr depends on this)
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx          # every outbound request carries a context (§6 deadlines)
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      # `shadow` is deliberately NOT enabled. It is opt-in in govet because
      # re-declaring err inside a narrower scope is idiomatic Go, and it fired
      # 79 times here with no true positive among them. arch-lint plus the
      # errcheck/nilerr/errorlint trio cover the error-handling mistakes that
      # actually matter.
      enable-all: false
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
        # G304 "file inclusion via variable" fires 23 times because opening a
        # path the user named is the entire job of a CLI: --config, --api-key-file,
        # the cache directory, an upload source, a download destination. The
        # traversal risk that is real here is a SERVER-supplied name, and that
        # is handled explicitly in internal/cli/download.go (safeLocalName
        # rejects separators, absolute paths and .. rather than stripping them)
        # and covered by its own tests.
        - G304
        # G115 integer conversions are all in internal/cache/generation.go,
        # where a millisecond timestamp is packed into a fixed 16-byte
        # generation. The truncation is the encoding, and the negative case is
        # guarded explicitly at generation.go:43.
        - G115
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are reviewed, not linted
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: unreachable-code
    staticcheck:
      checks:
        - all
    misspell:
      # No locale is set on purpose. PayCLI's prose is British ("normalise",
      # "behaviour") while the Payload API it mirrors is American and appears
      # verbatim in identifiers and strings: `localized: true` is a Payload
      # field name, `Unauthorized` is an HTTP status. Pinning either locale
      # makes the linter demand that one of those two be wrong. Unset, misspell
      # still catches real typos.

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - perfsprint
          # 43 of 50 errcheck hits are tests ignoring the return of a fluent
          # builder (e.WithHint(...), e.Recode(...)). Checking those adds no
          # signal; a test that silently swallowed a real error fails anyway.
          - errcheck
          - bodyclose
      # exec.Command with a variable is the feature, not a finding: §5.1's
      # credential_helper runs a command the user configured, §15 re-execs the
      # updated binary, and cosign is invoked by path. None of these go through
      # a shell, so there is no injection surface - the argv is built as a slice.
      - path: (internal/secret/helper|internal/update/detach|internal/update/verify)\.go
        linters:
          - gosec
      # These write files that MUST be executable or world-readable: the
      # replacement binary (0755) and recorded test fixtures.
      - path: (internal/update/platform_unix|internal/update/update|internal/payloadtest/golden|tools/recordfixtures/main)\.go
        linters:
          - gosec
      # internal/cli/app.go is the one file allowed to own the real streams.
      - path: internal/cli/app\.go
        linters:
          - gochecknoglobals

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KLIXPERT-io/pay-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
